services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: sitora
      POSTGRES_USER: sitora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    # В образах PostgreSQL 18 том монтируется в /var/lib/postgresql, а не в /data.
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitora -d sitora"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Общий кэш каталога, второго фактора и отметок «в сети». Без него API работает на кэше в памяти.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-совместимое хранилище для разработки: консоль http://localhost:9001, API http://localhost:9000.
  # API пользуется им при STORAGE_PROVIDER=S3; бакет (по умолчанию sitora) создайте в консоли.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:-sitora-dev}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:?Задайте STORAGE_S3_SECRET_KEY (пароль MinIO, от 8 символов) в файле .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  webapi:
    build:
      context: .
      dockerfile: backend/src/Sitora.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=db;Port=5432;Database=sitora;Username=sitora;Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379,abortConnect=false
      Jwt__Key: ${JWT_KEY:?Задайте JWT_KEY в файле .env}
      Encryption__Key: ${ENCRYPTION_KEY:?Задайте ENCRYPTION_KEY в файле .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}
      SEED_ACCOUNTANT_PASSWORD: ${SEED_ACCOUNTANT_PASSWORD:-}
      SEED_CONTENT_PASSWORD: ${SEED_CONTENT_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Хранилище файлов: Local — том files ниже; S3 — MinIO / Cloudflare R2 / Backblaze B2 / AWS (docs/DEPLOY.md, «Файлы»).
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__RootPath: /app/storage
      Storage__S3__Endpoint: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      Storage__S3__Bucket: ${STORAGE_S3_BUCKET:-sitora}
      Storage__S3__AccessKey: ${STORAGE_S3_ACCESS_KEY:-}
      Storage__S3__SecretKey: ${STORAGE_S3_SECRET_KEY:-}
      Storage__S3__Region: ${STORAGE_S3_REGION:-us-east-1}
    volumes:
      - files:/app/storage
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  pgdata:
  files:
  miniodata:
