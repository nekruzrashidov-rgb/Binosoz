# Продакшен на одном VPS: PostgreSQL 18 + Redis + API + Caddy (HTTPS с автоматическим сертификатом Let's Encrypt).
# Образ API — готовый из GHCR (его публикует CI на каждый push в main, деплой — docs/VPS_SETUP.md):
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml run --rm migrate && docker compose -f docker-compose.prod.yml up -d
# Конкретная версия: WEBAPI_IMAGE=ghcr.io/nekruzrashidov-rgb/binosoz-api:<sha коммита>. Собрать на сервере, как раньше: ... build migrate. Подробно — docs/DEPLOY.md.
name: sitora

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: sitora
      POSTGRES_USER: sitora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    # В образах PostgreSQL 18 том монтируется в /var/lib/postgresql, а не в /data.
    volumes:
      - pgdata:/var/lib/postgresql
    # Порт базы наружу не открыт: к ней ходит только API внутри сети docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitora -d sitora"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Общий кэш каталога, второго фактора и отметок «в сети»; нужен, когда экземпляров API больше одного.
  # Наружу не открыт, данные на диске (appendonly), чтобы перезапуск Redis не сбрасывал блокировки входа.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Отдельная команда деплоя: применяет миграции, создаёт роли и первого админа и завершается.
  # API в Production миграции сам не применяет и без неё не стартует.
  migrate:
    build:
      context: .
      dockerfile: backend/src/Sitora.WebApi/Dockerfile
    image: ${WEBAPI_IMAGE:-ghcr.io/nekruzrashidov-rgb/binosoz-api:latest}
    command: ["--migrate"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=sitora;Username=sitora;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Задайте JWT_KEY в файле .env}
      Encryption__Key: ${ENCRYPTION_KEY:?Задайте ENCRYPTION_KEY в файле .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  webapi:
    image: ${WEBAPI_IMAGE:-ghcr.io/nekruzrashidov-rgb/binosoz-api:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=sitora;Username=sitora;Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379,abortConnect=false
      Jwt__Key: ${JWT_KEY:?Задайте JWT_KEY в файле .env}
      Encryption__Key: ${ENCRYPTION_KEY:?Задайте ENCRYPTION_KEY в файле .env}
      AllowedHosts: ${API_DOMAIN:?Задайте API_DOMAIN в файле .env}
      Cors__AllowedOrigins__0: ${SITE_ORIGIN:?Задайте SITE_ORIGIN в файле .env}
      Cors__AllowedOrigins__1: ${CRM_ORIGIN:-}
      # API доступен только через Caddy, поэтому заголовкам X-Forwarded-* можно доверять.
      ForwardedHeaders__Enabled: "true"
      # Коды входа и приглашения уходят письмами: Smtp или Resend.
      Email__Provider: ${EMAIL_PROVIDER:?Задайте EMAIL_PROVIDER (Smtp или Resend) в файле .env}
      Email__From: ${EMAIL_FROM:?Задайте EMAIL_FROM в файле .env}
      Email__InviteUrl: ${EMAIL_INVITE_URL:?Задайте EMAIL_INVITE_URL, например https://crm.sitora.tj/accept-invite#token=}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Resend__ApiKey: ${RESEND_API_KEY:-}
      Claude__ApiKey: ${CLAUDE_API_KEY:-}
      # JSON-логи в файлы на томе logs (по дню, 14 дней); stdout пишется всегда.
      Logging__File__Enabled: "true"
      Sentry__Dsn: ${SENTRY_DSN:-}
      Health__Key: ${HEALTH_KEY:-}
      Auth__RefreshCookie__Mode: ${AUTH_REFRESH_COOKIE_MODE:-Dual}
      # Хранилище файлов: Local — том files ниже; S3 — MinIO / Cloudflare R2 / Backblaze B2 / AWS (docs/DEPLOY.md, «Файлы»).
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__RootPath: /app/storage
      Storage__S3__Endpoint: ${STORAGE_S3_ENDPOINT:-}
      Storage__S3__Bucket: ${STORAGE_S3_BUCKET:-}
      Storage__S3__AccessKey: ${STORAGE_S3_ACCESS_KEY:-}
      Storage__S3__SecretKey: ${STORAGE_S3_SECRET_KEY:-}
      Storage__S3__Region: ${STORAGE_S3_REGION:-us-east-1}
    volumes:
      - files:/app/storage
      # JSON-логи по дням, хранятся 14 дней (Serilog, appsettings.Production.json).
      - logs:/app/logs
    # В образе нет curl: проверку делает сам API в режиме --healthcheck (запрос к /health/live).
    healthcheck:
      test: ["CMD", "dotnet", "Sitora.WebApi.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Своё S3-хранилище на том же сервере (необязательно): docker compose -f docker-compose.prod.yml --profile minio up -d,
  # затем STORAGE_PROVIDER=S3, STORAGE_S3_ENDPOINT=http://minio:9000 и ключи MinIO в .env. Бакет создаётся в консоли MinIO.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["minio"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:?Задайте STORAGE_S3_ACCESS_KEY в файле .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:?Задайте STORAGE_S3_SECRET_KEY в файле .env}
    volumes:
      - miniodata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      webapi:
        condition: service_healthy

volumes:
  pgdata:
  files:
  logs:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
