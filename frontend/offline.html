<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нет подключения — Binosoz</title>

<body data-page="offline">
<!-- Shown by the Service Worker (sw.js) when there is no network and the page was never opened before. No scripts: works fully offline. -->
<main class="wrap" style="min-height: 100vh; display: grid; place-items: center; text-align: center;">
  <div class="card stack" style="max-width: 440px;">
    <h1>Нет подключения</h1>
    <p class="muted">Проверьте интернет и обновите страницу. Страницы, которые вы уже открывали, доступны и без сети.</p>
    <p class="muted" lang="tg">Пайвастшавӣ нест. Интернетро санҷед ва саҳифаро аз нав кушоед.</p>
    <p class="muted" lang="en">No connection. Check the internet and reload the page.</p>
    <div><a class="btn gold" href="/">Обновить</a></div>
  </div>
</main>
</body>
</html>
