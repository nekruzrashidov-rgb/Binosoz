<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вход — Некруз Резиденс</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4efe7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<style>
  /* Login only (design docs/design/Login.dc.html): a dark column with a render of the 3D model on the left (55%),
     the form on the right. Colours come from the tokens, so the dark theme works too. */
  body[data-page='login'] { background: var(--bg); }
  .lg-split { display: grid; grid-template-columns: 55fr 45fr; min-height: 100vh; min-height: 100dvh; }
  .lg-hero { position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; padding: clamp(24px, 4vw, 56px); background: var(--espresso); color: var(--ink); }
  .lg-pic { position: absolute; inset: 0; z-index: -2; margin: 0; }
  .lg-pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block; }
  .lg-note { top: auto; bottom: 16px; right: 16px; }
  .lg-shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(20, 17, 15, 0.6) 0%, rgba(20, 17, 15, 0.3) 40%, rgba(20, 17, 15, 0.9) 100%); }
  .lg-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .lg-brand { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; color: var(--ink); text-decoration: none; }
  .lg-brand:hover { text-decoration: none; }
  .lg-brand .tower-logo { color: var(--ink); }
  .lg-lang { background: none; border: 1px solid rgba(244, 239, 231, 0.4); border-radius: 2px; padding: 0; gap: 0; }
  .lg-lang button { border-radius: 0; min-width: 44px; min-height: 44px; color: var(--ink); }
  .lg-lang button.on { background: var(--ink); color: var(--espresso); box-shadow: none; }
  .lg-hero-text { max-width: 560px; }
  .lg-eyebrow { display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-text); }
  .lg-eyebrow::before { content: ''; width: 36px; height: 1px; background: currentColor; }
  .lg-name { font-family: var(--display); font-weight: 500; font-size: clamp(38px, 4.8vw, 64px); line-height: 1.02; letter-spacing: -0.01em; margin: 18px 0 16px; color: var(--ink); }
  .lg-sub { color: var(--ink-2); font-size: 17px; line-height: 1.6; max-width: 460px; }
  .lg-facts { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); font-weight: 600; }
  .lg-facts li { display: flex; align-items: center; gap: 10px; min-height: 36px; }
  .lg-facts svg { color: var(--accent-text); }
  .lg-facts a { color: inherit; display: inline-flex; align-items: center; min-height: 44px; }
  .lg-side { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; padding: clamp(20px, 4vw, 48px); background: var(--bg); color: var(--ink); }
  .lg-frame { position: relative; width: 100%; max-width: 460px; }
  .lg-frame > .card.login { max-width: none; width: 100%; margin: 0; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); padding: clamp(22px, 3vw, 36px); box-shadow: 0 24px 60px rgba(27, 24, 21, 0.08); }
  .lg-split .card.login h2 { font-family: var(--display); font-weight: 500; font-size: 36px; }
  .lg-split .card.login .inp { height: 52px; border-radius: 2px; font-size: 16px; }
  .lg-split .card.login .inp:focus, .lg-split .card.login .inp:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .lg-split .card.login .btn { border-radius: 2px; }
  .lg-split .card.login .btn.lg.block { height: 56px; padding-block: 0; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 14px; }
  .lg-split .card.login .btn.lg.block:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .lg-split .login-tabs, .lg-split .login-tabs button { border-radius: 2px; }
  .lg-split .login-tabs button { min-height: 44px; }
  .lg-demo { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 13px; }
  .lg-demo p { margin: 0; font-weight: 700; }
  .lg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .lg-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: 44px; border-radius: 2px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
  .lg-chip:hover { border-color: var(--ink); }
  .lg-chip b { color: var(--accent-text); }
  .lg-chip span { color: var(--muted); }
  @media (max-width: 768px) {
    .lg-split { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    /* On a phone the picture is a strip with the logo, the languages and the title. */
    .lg-hero { padding: 14px 16px 22px; gap: 18px; min-height: 260px; }
    .lg-eyebrow, .lg-facts, .lg-note { display: none; }
    .lg-name { font-size: 32px; margin: 0; }
    .lg-sub { font-size: 15px; margin-top: 8px; }
    .lg-side { justify-content: flex-start; padding: 20px 16px 32px; }
  }
</style>
</head>
<body data-page="login">
<div id="app"></div>
<script src="/js/tanzimot-api-url.js" defer></script>
<script src="/js/pwa-sabt.js" defer></script>
<script src="/js/i18n/ru.js" defer></script>
<script src="/js/tarjumaho-ru-tg-en.js" defer></script>
<script src="/js/komponentho-modal-toast-tabs.js" defer></script>
<script src="/js/zaprosho-ba-backend.js" defer></script>
<script src="/js/kabineti-xaridor-script.js" defer></script>
<script src="/js/routing-va-navigatsiya.js" defer></script>
</body>
</html>
