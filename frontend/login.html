<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вход — Некруз Резиденс</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f5f0e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Unbounded:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<style>
  /* Login only: the project on the left (55%), the form on the right. Light cream like the rest of the site;
     colours come from the tokens, so the dark theme works too. */
  body[data-page='login'] { background: var(--bg); }
  .lg-split { display: grid; grid-template-columns: 55fr 45fr; min-height: 100vh; min-height: 100dvh; }
  .lg-hero { position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; padding: clamp(24px, 4vw, 56px);
    background: radial-gradient(900px 520px at 20% 110%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%), var(--surface-2); color: var(--ink); }
  .lg-sky { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
  .lg-sky i { position: absolute; border-radius: 50%; background: var(--accent); opacity: 0; animation: lg-float 10s ease-in-out infinite; }
  @keyframes lg-float { 0% { opacity: 0; transform: translateY(18px); } 25% { opacity: 0.5; } 75% { opacity: 0.3; } 100% { opacity: 0; transform: translateY(-46px); } }
  .lg-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .lg-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-family: var(--display); font-weight: 600; letter-spacing: 0.08em; text-decoration: none; }
  .lg-brand:hover { text-decoration: none; }
  .lg-brand svg { width: 30px; height: 30px; flex: none; }
  .lg-hero-text { max-width: 560px; animation: rise 0.8s cubic-bezier(.2, .8, .2, 1) both; }
  .lg-eyebrow { display: inline-flex; padding: 6px 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent-text); font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .lg-name { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 5.4vw, 72px); line-height: 1.02; letter-spacing: -0.01em; text-transform: uppercase; margin: 18px 0 16px; color: var(--ink); }
  .lg-sub { color: var(--ink-2); font-size: 16px; max-width: 460px; }
  .lg-facts { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; color: var(--ink-2); font-weight: 600; }
  .lg-facts li { display: flex; align-items: center; gap: 10px; }
  .lg-facts svg { color: var(--accent-text); }
  .lg-facts a { color: inherit; }
  .lg-side { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; padding: clamp(20px, 4vw, 48px); background: var(--bg); color: var(--ink); }
  .lg-frame { position: relative; width: 100%; max-width: 440px; }
  .lg-frame > .card.login { max-width: none; width: 100%; margin: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); padding: clamp(20px, 3vw, 32px); box-shadow: var(--shadow); }
  .lg-split .card.login .inp { height: 52px; border-radius: 14px; font-size: 16px; }
  .lg-split .card.login .inp:focus, .lg-split .card.login .inp:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .lg-split .card.login .btn.lg.block { height: 52px; padding-block: 0; border-radius: 14px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 800; }
  .lg-split .card.login .btn.lg.block:hover:not(:disabled) { background: var(--accent-text); border-color: var(--accent-text); }
  .lg-demo { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 13px; }
  .lg-demo p { margin: 0; font-weight: 700; }
  .lg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .lg-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; transition: background 0.15s ease, transform 0.15s ease; }
  .lg-chip:hover { background: var(--accent-soft); transform: translateY(-1px); }
  .lg-chip b { color: var(--accent-text); }
  .lg-chip span { color: var(--muted); }
  @media (max-width: 768px) {
    .lg-split { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    /* On a phone the project is a slim strip: logo and name on one line, the languages on the right. */
    .lg-hero { padding: 12px 16px; gap: 4px; }
    .lg-hero-top { align-items: center; }
    .lg-hero-text { animation: none; }
    .lg-eyebrow, .lg-sub, .lg-facts, .lg-sky { display: none; }
    .lg-name { font-size: 18px; margin: 2px 0 0; }
    .lg-side { justify-content: flex-start; padding: 16px 16px 32px; }
  }
  @media (prefers-reduced-motion: reduce) { .lg-sky i, .lg-hero-text { animation: none; } .lg-sky i { opacity: 0.3; } }
</style>
</head>
<body data-page="login">
<div id="app"></div>
<script src="/js/tanzimot-api-url.js" defer></script>
<script src="/js/pwa-sabt.js" defer></script>
<script src="/js/i18n/ru.js" defer></script>
<script src="/js/tarjumaho-ru-tg-en.js" defer></script>
<script src="/js/komponentho-modal-toast-tabs.js" defer></script>
<script src="/js/zaprosho-ba-backend.js" defer></script>
<script src="/js/kabineti-xaridor-script.js" defer></script>
<script src="/js/routing-va-navigatsiya.js" defer></script>
</body>
</html>
