# Сборка, тесты и Docker-образ на каждый push и pull request; на push в main — образ в GHCR, деплой на Render (Deploy Hook)
# и на VPS (docs/VPS_SETUP.md), если заданы их секреты.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # В main прогон не прерывается: иначе новый push мог бы остановить деплой посреди миграции.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Сборка и тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Решение и проекты .NET лежат в backend/.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Восстановление пакетов
        run: dotnet restore

      - name: Сборка
        run: dotnet build --configuration Release --no-restore --warnaserror

      # PostgreSQL 18 для тестов поднимает Testcontainers: Docker на раннере GitHub уже есть.
      - name: Тесты
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory test-results

      - name: Результаты тестов
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: backend/test-results

  docker:
    name: Docker-образ и compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # На push в main образ публикуется в GHCR с тегом коммита; тег latest ставит deploy, когда пройдут тесты.
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      # Имя образа в GHCR — строчными буквами.
      - name: Имя образа
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/binosoz-api" >> "$GITHUB_OUTPUT"

      - name: Сборка образа
      # Версия сборки (коммит и время) попадает в /health/live и в version.txt сайта.
        run: >
          docker build --file backend/src/Sitora.WebApi/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }}
          --build-arg BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          --tag sitora-webapi:ci --tag "${{ steps.name.outputs.image }}:${{ github.sha }}" .

      - name: Публикация в GHCR (только main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.name.outputs.image }}:${{ github.sha }}"

      # Значения-заглушки нужны только для разбора файлов: compose требует обязательные переменные.
      - name: Проверка compose-файлов
        env:
          POSTGRES_PASSWORD: ci
          JWT_KEY: ci
          ENCRYPTION_KEY: ci
          API_DOMAIN: api.example.test
          SITE_ORIGIN: https://example.test
          EMAIL_PROVIDER: Dev
          EMAIL_FROM: noreply@example.test
          EMAIL_INVITE_URL: https://example.test/accept-invite#token=
          STORAGE_S3_ACCESS_KEY: ci
          STORAGE_S3_SECRET_KEY: ci-minio-password
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

  deploy:
    name: Деплой на VPS
    needs: [build-and-test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Одновременно — только один деплой; новый ждёт, пока закончится предыдущий.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      # Тесты прошли: образ этого коммита становится latest (без пересборки).
      - name: Тег latest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${{ github.sha }}"

      # Render: Deploy Hook из секрета RENDER_DEPLOY_HOOK_URL (docs/DEPLOY.md, «Render: деплой»). Сервис, переведённый на
      # готовый образ из GHCR (переменная репозитория RENDER_DEPLOY_MODE=image), получает образ этого коммита (?imgURL=…),
      # сервис со сборкой из репозитория — просто команду собрать последний коммит. Нет секрета — шаг ничего не делает.
      - name: Деплой на Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_MODE: ${{ vars.RENDER_DEPLOY_MODE }}
          IMAGE_REF: ${{ needs.docker.outputs.image }}:${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Секрет RENDER_DEPLOY_HOOK_URL не задан — деплой на Render не запускается (Render деплоит сам, если включён Auto-Deploy)."
            exit 0
          fi
          url="$RENDER_DEPLOY_HOOK_URL"
          if [ "$RENDER_DEPLOY_MODE" = "image" ]; then
            sep='?'; case "$url" in *'?'*) sep='&';; esac
            url="$url${sep}imgURL=$(printf '%s' "$IMAGE_REF" | jq -sRr @uri)"
            echo "Render: деплой образа $IMAGE_REF"
          else
            echo "Render: сборка последнего коммита из репозитория"
          fi
          curl -fsS -X POST "$url" -o /dev/null
          echo "Render принял деплой. Проверка версии: /health/live → version = ${GITHUB_SHA:0:7}"

      # Пока секреты сервера не заданы (VPS_HOST, VPS_USER, VPS_SSH_KEY), шаг пропускается и CI остаётся зелёным.
      # На сервере: свежие compose-файлы из git, образ этого коммита, бэкап, миграции отдельной командой, перезапуск.
      # Если миграция упала, API остаётся на старой версии (up не выполняется).
      - name: Обновление на сервере
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1
        env:
          WEBAPI_IMAGE: ${{ needs.docker.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sitora' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: WEBAPI_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git pull --ff-only
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export WEBAPI_IMAGE
            docker compose -f docker-compose.prod.yml pull migrate webapi
            ./scripts/backup.sh
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
