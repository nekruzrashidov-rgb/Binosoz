# Сборка, тесты и Docker-образ на каждый push и pull request; на push в main — образ в GHCR, деплой на Render (Deploy Hook)
# и на VPS (docs/VPS_SETUP.md), если заданы их секреты.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # В main прогон не прерывается: иначе новый push мог бы остановить деплой посреди миграции.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Сборка и тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Решение и проекты .NET лежат в backend/.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Восстановление пакетов
        run: dotnet restore

      - name: Сборка
        run: dotnet build --configuration Release --no-restore --warnaserror

      # PostgreSQL 18 для тестов поднимает Testcontainers: Docker на раннере GitHub уже есть.
      - name: Тесты
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory test-results

      - name: Результаты тестов
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: backend/test-results

  # Сайт в браузере (Playwright, Chromium): страницы, пустые состояния, вход, язык, тема, мобильное меню,
  # 320 px без горизонтальной прокрутки, контраст WCAG AA в светлой и тёмной теме. API не нужен.
  e2e:
    name: Сайт в браузере (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/tools/e2e
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/tools/e2e/package-lock.json

      - name: Пакеты
        run: npm ci

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Тесты
        run: npx playwright test --grep-invert "3D on the whole screen"

      # 3D-сцена в CI рисуется на SwiftShader (без видеокарты): параллельно с другими тестами кадр идёт секунды и
      # тесты падают по времени. Поэтому 3D — отдельным шагом, в один поток.
      - name: Тесты 3D (в один поток)
        if: success() || failure()
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-3d
        run: npx playwright test tests/house3d.spec.js --workers=1

      - name: Отчёт при ошибке
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/tools/e2e/playwright-report
            frontend/tools/e2e/playwright-report-3d

  docker:
    name: Docker-образ и compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # На push в main образ публикуется в GHCR с тегом коммита; тег latest ставит deploy, когда пройдут тесты.
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      # Имя образа в GHCR — строчными буквами.
      - name: Имя образа
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/binosoz-api" >> "$GITHUB_OUTPUT"

      - name: Сборка образа
      # Версия сборки (коммит и время) попадает в /health/live и в version.txt сайта.
        run: >
          docker build --file backend/src/Sitora.WebApi/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }}
          --build-arg BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          --tag sitora-webapi:ci --tag "${{ steps.name.outputs.image }}:${{ github.sha }}" .

      - name: Публикация в GHCR (только main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.name.outputs.image }}:${{ github.sha }}"

      # Значения-заглушки нужны только для разбора файлов: compose требует обязательные переменные.
      - name: Проверка compose-файлов
        env:
          POSTGRES_PASSWORD: ci
          JWT_KEY: ci
          ENCRYPTION_KEY: ci
          API_DOMAIN: api.example.test
          SITE_ORIGIN: https://example.test
          EMAIL_PROVIDER: Dev
          EMAIL_FROM: noreply@example.test
          EMAIL_INVITE_URL: https://example.test/accept-invite#token=
          STORAGE_S3_ACCESS_KEY: ci
          STORAGE_S3_SECRET_KEY: ci-minio-password
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

  deploy:
    name: Деплой на VPS
    needs: [build-and-test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Одновременно — только один деплой; новый ждёт, пока закончится предыдущий.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      # Тесты прошли: образ этого коммита становится latest (без пересборки).
      - name: Тег latest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${{ github.sha }}"

      # Production API не применяет миграции сам и не стартует, если они есть: сначала миграции образом этого коммита
      # (секрет PROD_DATABASE_URL — External Database URL из Render, как в seed-prod.yml), потом деплой. Ошибка миграции —
      # шаг падает, деплой не запускается. Строка подключения маскируется в логе.
      - name: Миграции продакшен-базы
        id: migrate
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          IMAGE_REF: ${{ needs.docker.outputs.image }}:${{ github.sha }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "Секрет PROD_DATABASE_URL не задан — миграции перед деплоем на Render не применяются."
            echo "### ⚠️ Миграции не применены: задайте секрет PROD_DATABASE_URL (docs/DEPLOY.md, «Render: деплой»)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cs=$(python3 -c 'import os,urllib.parse as u; r=u.urlparse(os.environ["PROD_DATABASE_URL"]); print(f"Host={r.hostname};Port={r.port or 5432};Database={r.path.lstrip(chr(47))};Username={u.unquote(r.username or chr(32)).strip()};Password={u.unquote(r.password or chr(32)).strip()};SSL Mode=Require")')
          echo "::add-mask::$cs"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --rm -e ASPNETCORE_ENVIRONMENT=Production -e "ConnectionStrings__Default=$cs" "$IMAGE_REF" --migrate
          echo "Миграции применены образом $IMAGE_REF"

      # Render: Deploy Hook из секрета RENDER_DEPLOY_HOOK_URL (docs/DEPLOY.md, «Render: деплой»). Сервис, переведённый на
      # готовый образ из GHCR (переменная репозитория RENDER_DEPLOY_MODE=image), получает образ этого коммита (?imgURL=…),
      # сервис со сборкой из репозитория — просто команду собрать последний коммит. Нет секрета — крупное предупреждение
      # в summary. После hook — ждём до 10 минут, пока /health/live не отдаст версию этого коммита.
      - name: Деплой на Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_MODE: ${{ vars.RENDER_DEPLOY_MODE }}
          IMAGE_REF: ${{ needs.docker.outputs.image }}:${{ github.sha }}
          API_URL: ${{ vars.SMOKE_API_URL || 'https://binosoz-1.onrender.com' }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Секрет RENDER_DEPLOY_HOOK_URL не задан — деплой на Render не запускается (Render деплоит сам, если включён Auto-Deploy)."
            echo "# ⚠️ Render не деплоится автоматически: задайте секрет RENDER_DEPLOY_HOOK_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Где взять: Render → сервис → Settings → Deploy Hook (docs/DEPLOY.md, «Render: деплой»)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url="$RENDER_DEPLOY_HOOK_URL"
          if [ "$RENDER_DEPLOY_MODE" = "image" ]; then
            sep='?'; case "$url" in *'?'*) sep='&';; esac
            url="$url${sep}imgURL=$(printf '%s' "$IMAGE_REF" | jq -sRr @uri)"
            echo "Render: деплой образа $IMAGE_REF"
          else
            echo "Render: сборка последнего коммита из репозитория"
          fi
          curl -fsS -X POST "$url" -o /dev/null
          want="${GITHUB_SHA:0:7}"
          echo "Render принял деплой. Жду версию $want на $API_URL/health/live (до 10 минут)…"
          for i in $(seq 1 40); do
            got=$(curl -s --max-time 20 "$API_URL/health/live" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$got" = "$want" ]; then echo "Render: работает версия $want"; exit 0; fi
            echo "Попытка $i: на Render версия ${got:-нет ответа}, жду 15 с"
            sleep 15
          done
          echo "::error::Render за 10 минут не перешёл на версию $want (сейчас: ${got:-нет ответа}). Проверьте логи деплоя в Render (docs/DEPLOY.md)."
          echo "# ❌ Render не перешёл на версию $want за 10 минут (сейчас: ${got:-нет ответа})" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Пока секреты сервера не заданы (VPS_HOST, VPS_USER, VPS_SSH_KEY), шаг пропускается и CI остаётся зелёным.
      # На сервере: свежие compose-файлы из git, образ этого коммита, бэкап, миграции отдельной командой, перезапуск.
      # Если миграция упала, API остаётся на старой версии (up не выполняется).
      - name: Обновление на сервере
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1
        env:
          WEBAPI_IMAGE: ${{ needs.docker.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sitora' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: WEBAPI_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git pull --ff-only
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export WEBAPI_IMAGE
            docker compose -f docker-compose.prod.yml pull migrate webapi
            ./backend/scripts/backup.sh
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
