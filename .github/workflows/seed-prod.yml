# Заполнение продакшен-базы демо-каталогом без psql на своём компьютере. Только вручную: Actions → «Seed prod» →
# Run workflow, в поле confirm — nekruz. Шаги:
#  1. миграции — образ API из GHCR с --migrate (новые столбцы эко-паспорта и «зелёных» настроек нужны seed.sql);
#  2. backend/scripts/seed.sql — дом, этажи, квартиры, демо-эко-паспорт и тарифы (помечены как демо);
#  3. демо-доступ для жюри — только если секрет SEED_DEMO_ACCOUNTS = true: тот же образ с --migrate создаёт
#     demo-buyer@binosoz.tj и demo-manager@binosoz.tj с паролями из секретов SEED_DEMO_BUYER_PASSWORD и
#     SEED_DEMO_MANAGER_PASSWORD, демо-сделку с графиком, чатом и актом сверки в PDF.
# Вход демо-покупателя паролем включается на Render переменной Auth__DemoPasswordLogin=true.
# Строка подключения — секрет PROD_DATABASE_URL (External Database URL из Render); в лог она не попадает (маскируется).
# Повторный запуск ничего не дублирует. После заполнения — smoke-проверка каталога.
name: Seed prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Подтверждение: введите nekruz"
        required: true
      api_url:
        description: Адрес API для проверки после заполнения
        default: https://binosoz-1.onrender.com

permissions:
  contents: read

concurrency:
  group: seed-prod
  cancel-in-progress: false

jobs:
  seed:
    name: Демо-каталог в базе прода
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Подтверждение
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "nekruz" ]; then
            echo "::error::Подтверждение не совпало: в поле confirm нужно ввести nekruz. База не тронута."
            exit 1
          fi

      - name: Секрет
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::Секрет PROD_DATABASE_URL не задан: Settings → Secrets and variables → Actions → New repository secret (External Database URL из Render). Подробно — docs/DEPLOY.md, «Демо-данные в пустой базе»."
            exit 1
          fi

      - uses: actions/checkout@v5

      # postgresql://user:pass@host:port/db?… → строка подключения Npgsql (SSL обязателен). Значение маскируется в логе.
      - name: Строка подключения для API
        id: cs
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          cs=$(python3 -c 'import os,urllib.parse as u; r=u.urlparse(os.environ["PROD_DATABASE_URL"]); print(f"Host={r.hostname};Port={r.port or 5432};Database={r.path.lstrip(chr(47))};Username={u.unquote(r.username or chr(32)).strip()};Password={u.unquote(r.password or chr(32)).strip()};SSL Mode=Require")')
          echo "::add-mask::$cs"
          echo "value=$cs" >> "$GITHUB_OUTPUT"

      - name: Миграции (образ API)
        env:
          CS: ${{ steps.cs.outputs.value }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/binosoz-api:latest"
          docker run --rm -e ASPNETCORE_ENVIRONMENT=Production -e "ConnectionStrings__Default=$CS" "$image" --migrate

      - name: psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null
          psql --version

      # ON_ERROR_STOP: при ошибке — код выхода 1; seed.sql — один DO-блок, при ошибке в базе ничего не остаётся.
      # PGSSLMODE=require — если в строке подключения нет sslmode (Render принимает внешние подключения только по TLS).
      - name: seed.sql
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "30"
        run: psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f backend/scripts/seed.sql

      # Демо-доступ для жюри: только при SEED_DEMO_ACCOUNTS = true; без паролей учётные записи не создаются.
      - name: Демо-доступ для жюри
        env:
          CS: ${{ steps.cs.outputs.value }}
          SEED_DEMO_ACCOUNTS: ${{ secrets.SEED_DEMO_ACCOUNTS }}
          SEED_DEMO_BUYER_PASSWORD: ${{ secrets.SEED_DEMO_BUYER_PASSWORD }}
          SEED_DEMO_MANAGER_PASSWORD: ${{ secrets.SEED_DEMO_MANAGER_PASSWORD }}
        run: |
          if [ "$SEED_DEMO_ACCOUNTS" != "true" ]; then
            echo "Секрет SEED_DEMO_ACCOUNTS не равен true — демо-доступ не создаётся."
            exit 0
          fi
          if [ -z "$SEED_DEMO_BUYER_PASSWORD" ] || [ -z "$SEED_DEMO_MANAGER_PASSWORD" ]; then
            echo "::error::Задайте секреты SEED_DEMO_BUYER_PASSWORD и SEED_DEMO_MANAGER_PASSWORD (docs/DEPLOY.md, «За 15 минут до выступления»)."
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/binosoz-api:latest"
          docker run --rm -e ASPNETCORE_ENVIRONMENT=Production -e "ConnectionStrings__Default=$CS" \
            -e SEED_DEMO_ACCOUNTS=true -e SEED_DEMO_BUYER_PASSWORD -e SEED_DEMO_MANAGER_PASSWORD "$image" --migrate

      # Каталог кэшируется до 30 секунд: ждём, чтобы smoke увидел новые дома.
      - name: Проверка каталога
        env:
          API_URL: ${{ inputs.api_url || vars.SMOKE_API_URL || 'https://binosoz-1.onrender.com' }}
          ORG: ${{ vars.SMOKE_ORG || 'nekruz' }}
        run: |
          sleep 35
          bash backend/scripts/smoke.sh
