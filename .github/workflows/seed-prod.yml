# Заполнение продакшен-базы демо-каталогом без psql на своём компьютере. Только вручную: Actions → «Seed prod» →
# Run workflow, в поле confirm — nekruz. Шаги:
#  1. миграции — образ API из GHCR с --migrate (новые столбцы эко-паспорта и «зелёных» настроек нужны seed.sql);
#  2. backend/scripts/seed.sql — дом, этажи, квартиры, демо-эко-паспорт и тарифы (помечены как демо);
#  3. демо-доступ для жюри — только если секрет SEED_DEMO_ACCOUNTS = true: тот же образ с --migrate создаёт
#     demo-buyer@binosoz.tj и demo-manager@binosoz.tj с паролями из секретов SEED_DEMO_BUYER_PASSWORD и
#     SEED_DEMO_MANAGER_PASSWORD, демо-сделку с графиком, чатом и актом сверки в PDF.
#  4. сотрудники для входа под каждой ролью — только по парам секретов SEED_STAFF_<РОЛЬ>_EMAIL и _PASSWORD
#     (OBJECTADMIN, MANAGER, ACCOUNTANT, CONTENT): нет пары — роль не создаётся; есть — создаётся или пароль приводится к секрету
#     (сессии отзываются). Инструкция — docs/ROLES_LOGIN.md.
# Вход демо-покупателя паролем включается на Render переменной Auth__DemoPasswordLogin=true.
# Пароли в лог не попадают: все маскируются (::add-mask::), сидер их не пишет — только «создан / пароль обновлён / пропущен».
# Строка подключения — секрет PROD_DATABASE_URL (External Database URL из Render); в лог она не попадает (маскируется).
# Повторный запуск ничего не дублирует. После заполнения — smoke-проверка каталога.
name: Seed prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Подтверждение: введите nekruz"
        required: true
      api_url:
        description: Адрес API для проверки после заполнения
        default: https://binosoz-1.onrender.com

permissions:
  contents: read

concurrency:
  group: seed-prod
  cancel-in-progress: false

jobs:
  seed:
    name: Демо-каталог в базе прода
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Подтверждение
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "nekruz" ]; then
            echo "::error::Подтверждение не совпало: в поле confirm нужно ввести nekruz. База не тронута."
            exit 1
          fi

      - name: Секрет
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::Секрет PROD_DATABASE_URL не задан: Settings → Secrets and variables → Actions → New repository secret (External Database URL из Render). Подробно — docs/DEPLOY.md, «Демо-данные в пустой базе»."
            exit 1
          fi

      # Все пароли из секретов маскируются до первого шага, который их использует.
      - name: Маскирование паролей
        env:
          P1: ${{ secrets.SEED_DEMO_BUYER_PASSWORD }}
          P2: ${{ secrets.SEED_DEMO_MANAGER_PASSWORD }}
          P3: ${{ secrets.OWNER_PASSWORD || secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          P4: ${{ secrets.SUPERADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          P5: ${{ secrets.SEED_STAFF_OBJECTADMIN_PASSWORD }}
          P6: ${{ secrets.SEED_STAFF_ACCOUNTANT_PASSWORD }}
          P7: ${{ secrets.SEED_STAFF_CONTENT_PASSWORD }}
          P8: ${{ secrets.SEED_STAFF_MANAGER_PASSWORD }}
        run: |
          for v in "$P1" "$P2" "$P3" "$P4" "$P5" "$P6" "$P7" "$P8"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done

      - uses: actions/checkout@v5

      # postgresql://user:pass@host:port/db?… → строка подключения Npgsql (SSL обязателен). Значение маскируется в логе.
      - name: Строка подключения для API
        id: cs
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          cs=$(python3 -c 'import os,urllib.parse as u; r=u.urlparse(os.environ["PROD_DATABASE_URL"]); print(f"Host={r.hostname};Port={r.port or 5432};Database={r.path.lstrip(chr(47))};Username={u.unquote(r.username or chr(32)).strip()};Password={u.unquote(r.password or chr(32)).strip()};SSL Mode=Require")')
          echo "::add-mask::$cs"
          echo "value=$cs" >> "$GITHUB_OUTPUT"

      # Перед изменением прод-базы — зашифрованный бэкап (если задан открытый ключ BACKUP_AGE_RECIPIENT).
      - name: Бэкап базы
        id: backup
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -z "$BACKUP_AGE_RECIPIENT" ]; then
            echo "# ⚠️ Заполнение без бэкапа: задайте переменную BACKUP_AGE_RECIPIENT (docs/DEPLOY.md, «Бэкапы базы на Render»)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash backend/scripts/backup-remote.sh pre-seed

      - name: Сохранение бэкапа
        if: steps.backup.outputs.file != ''
        uses: actions/upload-artifact@v5
        with:
          name: db-backup-pre-seed-${{ github.run_id }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 90
          if-no-files-found: error

      - name: Миграции (образ API)
        env:
          CS: ${{ steps.cs.outputs.value }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/binosoz-api:latest"
          docker run --rm -e ASPNETCORE_ENVIRONMENT=Production -e "ConnectionStrings__Default=$CS" "$image" --migrate

      - name: psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null
          psql --version

      # ON_ERROR_STOP: при ошибке — код выхода 1; seed.sql — один DO-блок, при ошибке в базе ничего не остаётся.
      # PGSSLMODE=require — если в строке подключения нет sslmode (Render принимает внешние подключения только по TLS).
      - name: seed.sql
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "30"
        run: psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f backend/scripts/seed.sql

      # Демо-доступ для жюри: только при SEED_DEMO_ACCOUNTS = true; без паролей учётные записи не создаются.
      - name: Демо-доступ для жюри
        env:
          CS: ${{ steps.cs.outputs.value }}
          SEED_DEMO_ACCOUNTS: ${{ secrets.SEED_DEMO_ACCOUNTS }}
          SEED_DEMO_BUYER_PASSWORD: ${{ secrets.SEED_DEMO_BUYER_PASSWORD }}
          SEED_DEMO_MANAGER_PASSWORD: ${{ secrets.SEED_DEMO_MANAGER_PASSWORD }}
        run: |
          if [ "$SEED_DEMO_ACCOUNTS" != "true" ]; then
            echo "Секрет SEED_DEMO_ACCOUNTS не равен true — демо-доступ не создаётся."
            exit 0
          fi
          if [ -z "$SEED_DEMO_BUYER_PASSWORD" ] || [ -z "$SEED_DEMO_MANAGER_PASSWORD" ]; then
            echo "::error::Задайте секреты SEED_DEMO_BUYER_PASSWORD и SEED_DEMO_MANAGER_PASSWORD (docs/DEPLOY.md, «За 15 минут до выступления»)."
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/binosoz-api:latest"
          docker run --rm -e ASPNETCORE_ENVIRONMENT=Production -e "ConnectionStrings__Default=$CS" \
            -e SEED_DEMO_ACCOUNTS=true -e SEED_DEMO_BUYER_PASSWORD -e SEED_DEMO_MANAGER_PASSWORD "$image" --migrate

      # Первый владелец организации (Admin) и суперадмин платформы — только если заданы секреты.
      # Владелец создаётся, пока в организации нет владельцев; существующим паролям ничего не делается.
      # Остальные роли — следующий шаг (секреты SEED_STAFF_*) или приглашение из CRM (письмо со ссылкой).
      - name: Владелец и суперадмин
        env:
          CS: ${{ steps.cs.outputs.value }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.OWNER_EMAIL || secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.OWNER_PASSWORD || secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$BOOTSTRAP_ADMIN_EMAIL$ADMIN_EMAIL" ]; then
            echo "Секреты BOOTSTRAP_ADMIN_EMAIL и ADMIN_EMAIL не заданы — владелец и суперадмин не создаются."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/binosoz-api:latest"
          docker run --rm -e ASPNETCORE_ENVIRONMENT=Production -e "ConnectionStrings__Default=$CS" \
            -e BOOTSTRAP_ADMIN_EMAIL -e BOOTSTRAP_ADMIN_PASSWORD -e ADMIN_EMAIL -e ADMIN_PASSWORD "$image" --migrate

      # Сотрудники демо-организации для входа под каждой ролью (docs/ROLES_LOGIN.md). В лог — только строки сидера
      # «Сотрудник <роль> <почта>: создан / пароль обновлён / уже есть / пропущен»; пароли он не пишет.
      - name: Сотрудники по ролям
        env:
          CS: ${{ steps.cs.outputs.value }}
          SEED_STAFF_OBJECTADMIN_EMAIL: ${{ secrets.SEED_STAFF_OBJECTADMIN_EMAIL }}
          SEED_STAFF_OBJECTADMIN_PASSWORD: ${{ secrets.SEED_STAFF_OBJECTADMIN_PASSWORD }}
          SEED_STAFF_MANAGER_EMAIL: ${{ secrets.SEED_STAFF_MANAGER_EMAIL }}
          SEED_STAFF_MANAGER_PASSWORD: ${{ secrets.SEED_STAFF_MANAGER_PASSWORD }}
          SEED_STAFF_ACCOUNTANT_EMAIL: ${{ secrets.SEED_STAFF_ACCOUNTANT_EMAIL }}
          SEED_STAFF_ACCOUNTANT_PASSWORD: ${{ secrets.SEED_STAFF_ACCOUNTANT_PASSWORD }}
          SEED_STAFF_CONTENT_EMAIL: ${{ secrets.SEED_STAFF_CONTENT_EMAIL }}
          SEED_STAFF_CONTENT_PASSWORD: ${{ secrets.SEED_STAFF_CONTENT_PASSWORD }}
        run: |
          if [ -z "$SEED_STAFF_OBJECTADMIN_EMAIL$SEED_STAFF_MANAGER_EMAIL$SEED_STAFF_ACCOUNTANT_EMAIL$SEED_STAFF_CONTENT_EMAIL" ]; then
            echo "Секреты SEED_STAFF_* не заданы — сотрудники по ролям не создаются (пропущено)."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/binosoz-api:latest"
          set +e
          docker run --rm -e ASPNETCORE_ENVIRONMENT=Production -e "ConnectionStrings__Default=$CS" \
            -e SEED_STAFF_OBJECTADMIN_EMAIL -e SEED_STAFF_OBJECTADMIN_PASSWORD \
            -e SEED_STAFF_MANAGER_EMAIL -e SEED_STAFF_MANAGER_PASSWORD \
            -e SEED_STAFF_ACCOUNTANT_EMAIL -e SEED_STAFF_ACCOUNTANT_PASSWORD \
            -e SEED_STAFF_CONTENT_EMAIL -e SEED_STAFF_CONTENT_PASSWORD "$image" --migrate > staff.log 2>&1
          code=$?
          set -e
          lines=$(grep -o 'Сотрудник[^"]*' staff.log || true)
          echo "$lines"
          { echo "### Сотрудники по ролям"; echo '```'; echo "$lines"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error::Сидер сотрудников завершился с ошибкой (код $code) — причина выше; пароли в лог не пишутся."
            grep -E 'Сотрудники из секретов|Unhandled|Exception' staff.log | head -20 || true
            exit "$code"
          fi

      # Каталог кэшируется до 30 секунд: ждём, чтобы smoke увидел новые дома.
      - name: Проверка каталога
        env:
          API_URL: ${{ inputs.api_url || vars.SMOKE_API_URL || 'https://binosoz-1.onrender.com' }}
          ORG: ${{ vars.SMOKE_ORG || 'nekruz' }}
        run: |
          sleep 35
          bash backend/scripts/smoke.sh
